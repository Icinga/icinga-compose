if (Number(getenv("ICINGA_OTLPMETRICS_ENABLE"))) {
  object OTLPMetricsWriter "otlpmetrics" {
    host = getenv("ICINGA_OTLPMETRICS_HOST") || "127.0.0.1"
    port = getenv("ICINGA_OTLPMETRICS_PORT") || 4318
    metrics_endpoint = getenv("ICINGA_OTLPMETRICS_METRICS_ENDPOINT") || "/v1/metrics"
    service_namespace = getenv("ICINGA_OTLPMETRICS_SERVICE_NAMESPACE") || "icinga"
    flush_interval = getenv("ICINGA_OTLPMETRICS_FLUSH_INTERVAL") || 15
    flush_threshold = getenv("ICINGA_OTLPMETRICS_FLUSH_THRESHOLD") || 16 * 1024 * 1024
    enable_send_thresholds = Number(getenv("ICINGA_OTLPMETRICS_ENABLE_SEND_THRESHOLDS"))
    disconnect_timeout = getenv("ICINGA_OTLPMETRICS_DISCONNECT_TIMEOUT") || 10
    enable_tls = Number(getenv("ICINGA_OTLPMETRICS_ENABLE_TLS"))
    tls_insecure_noverify = Number(getenv("ICINGA_OTLPMETRICS_TLS_INSECURE_NOVERIFY"))
    tls_ca_file = getenv("ICINGA_OTLPMETRICS_TLS_CA_FILE")
    tls_cert_file = getenv("ICINGA_OTLPMETRICS_TLS_CERT_FILE")
    tls_key_file = getenv("ICINGA_OTLPMETRICS_TLS_KEY_FILE")

    if (getenv("ICINGA_OTLPMETRICS_ENABLE_HA")) {
      enable_ha = Number(getenv("ICINGA_OTLPMETRICS_ENABLE_HA"))
    }
  }
}

object GraphiteWriter "graphite" {
  host = "graphite"
}

object IcingaDB "icingadb" {
  host = "icingadb-redis"
  port = 6379
  password = getenv("ICINGADB_REDIS_PASSWORD")
}
